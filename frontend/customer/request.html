<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResQMate - Request Assistance</title>

    <link rel="stylesheet" href="../style/sidebar.css">
    <link rel="stylesheet" href="../style/request.css">
</head>

<body>

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">

        <div class="page-header">
            <h1>Request Assistance</h1>
            <p>Fill out the form below to request disaster assistance.</p>
        </div>

        <div class="request-card">

            <!-- Categories -->
            <div class="category-grid">

                <div class="category-card active">
                    🍞
                    <span>Food</span>
                </div>

                <div class="category-card">
                    💧
                    <span>Water</span>
                </div>

                <div class="category-card">
                    🏠
                    <span>Shelter</span>
                </div>

                <div class="category-card">
                    💊
                    <span>Medicine</span>
                </div>

            </div>

            <!-- Form -->
            <form>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" class="form-control" placeholder="Enter your location">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea class="form-control"
                        placeholder="Describe your situation and assistance needed..."></textarea>
                </div>

                <div class="form-group">
                    <label>Urgency Level</label>
                    <select class="form-control">
                        <option>Select urgency level</option>
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                        <option>Critical</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="reset" class="btn-cancel">
                        Cancel
                    </button>

                    <button type="submit" class="btn-submit">
                        Submit Request
                    </button>
                </div>

            </form>

        </div>

    </main>

    <script src="../components/loadSidebar.js"></script>

</body>

</html>
